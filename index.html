<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica 3 - DevOps | Víctor Enríquez Núñez Carvajal</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: radial-gradient(circle at top, #1e293b, #0f172a);
            color: #f8fafc;
            padding: 1.5rem;
        }
        .card {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        .badge {
            display: inline-block;
            background: #0284c7;
            color: #f0f9ff;
            font-size: 0.8rem;
            font-weight: 600;
            padding: 0.3rem 0.8rem;
            border-radius: 9999px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 1rem;
        }
        h1 {
            color: #38bdf8;
            font-size: 1.8rem;
            margin-bottom: 1rem;
        }
        .info-box {
            background: #0f172a;
            border-radius: 8px;
            padding: 1rem;
            margin: 1.5rem 0;
            text-align: left;
            border-left: 4px solid #38bdf8;
        }
        .info-box p {
            margin: 0.35rem 0;
            font-size: 0.95rem;
        }
        .info-box strong {
            color: #94a3b8;
        }
        .status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            color: #4ade80;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4ade80;
            box-shadow: 0 0 10px #4ade80;
        }
    </style>
</head>
<body>
    <div class="card">
        <span class="badge">Práctica 3 DevOps</span>
        <h1>¡Hola Mundo!</h1>
        <p style="color: #94a3b8; font-size: 0.95rem; margin-bottom: 1.2rem;">Página desplegada automáticamente desde GitHub a la nube</p>
        <div class="info-box">
            <p><strong>Estudiante:</strong> Víctor Enríquez Núñez Carvajal</p>
            <p><strong>Matrícula:</strong> 2012-0048</p>
            <p><strong>Pipeline:</strong> GitHub Actions & GitHub Pages</p>
        </div>
        <div class="status">
            <span class="status-dot"></span>
            <span>Página desplegada automáticamente con CI/CD</span>
        </div>
    </div>
</body>
</html>
